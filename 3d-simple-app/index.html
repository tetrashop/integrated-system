<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Simple App - نسخه نهایی</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            color: white;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 20;
            font-size: 14px;
        }
        button, input {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background: #ff6600;
            color: white;
        }
        input[type="range"] {
            width: 150px;
        }
        .help {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e2f;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 350px;
            text-align: center;
            color: white;
            z-index: 30;
            box-shadow: 0 10px 30px black;
            direction: ltr;
        }
        .help button {
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            #controls { font-size: 12px; padding: 10px; gap: 8px; }
            button, input { padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div id="info">
        🧊 مکعب سه‌بعدی | چرخش خودکار
    </div>
    <div id="controls">
        <div>🎨 رنگ:</div>
        <input type="color" id="colorPicker" value="#ff6600">
        <div>🌀 سرعت چرخش:</div>
        <input type="range" id="speedSlider" min="0" max="0.03" step="0.001" value="0.008">
        <button id="helpBtn">📘 راهنما</button>
    </div>
    <div id="helpModal" class="help" style="display: none;">
        <h3>راهنما</h3>
        <p>▪️ با ماوس یا انگشت بکشید تا دوربین بچرخد<br>
        ▪️ با دو انگشت زوم کنید<br>
        ▪️ رنگ و سرعت را از پنل پایین تغییر دهید</p>
        <button id="closeHelp">بستن</button>
    </div>

    <!-- بارگذاری Three.js از CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // صحنه، دوربین، رندرر
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // کنترلرهای دوربین (متناسب با لمس)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.enableZoom = true;
        controls.enablePan = true;
        
        // نورها
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(2, 5, 3);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        const backLight = new THREE.PointLight(0x4466cc, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        // کمک‌کننده: زمین شطرنجی اختیاری (نظر)
        const gridHelper = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
        gridHelper.position.y = -1;
        scene.add(gridHelper);
        
        // مکعب اصلی
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.3, metalness: 0.7 });
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        // متغیرهای کنترل
        let speed = 0.008;
        let colorPicker = document.getElementById('colorPicker');
        let speedSlider = document.getElementById('speedSlider');
        let helpBtn = document.getElementById('helpBtn');
        let helpModal = document.getElementById('helpModal');
        let closeHelp = document.getElementById('closeHelp');
        
        colorPicker.addEventListener('input', (e) => {
            cube.material.color.set(e.target.value);
        });
        
        speedSlider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
        });
        
        helpBtn.addEventListener('click', () => {
            helpModal.style.display = 'block';
        });
        
        closeHelp.addEventListener('click', () => {
            helpModal.style.display = 'none';
        });
        
        // نمایش FPS ساده (اختیاری) - در کنسول
        let lastTime = performance.now();
        let frames = 0;
        
        // حلقه انیمیشن
        function animate() {
            requestAnimationFrame(animate);
            
            // چرخش مکعب
            cube.rotation.x += speed;
            cube.rotation.y += speed * 0.8;
            
            // به‌روزرسانی کنترلرها
            controls.update();
            
            // رندر
            renderer.render(scene, camera);
            
            // محاسبه FPS (نمایش در کنسول هر 2 ثانیه)
            frames++;
            const now = performance.now();
            if (now - lastTime >= 2000) {
                const fps = (frames * 1000) / (now - lastTime);
                console.log(`FPS: ${fps.toFixed(1)}`);
                frames = 0;
                lastTime = now;
            }
        }
        
        animate();
        
        // تنظیم مجدد سایز پنجره
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('3D App loaded successfully!');
    </script>
</body>
</html>
