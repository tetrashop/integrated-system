<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 داشبورد یکپارچه</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0e17;
            color: #fffffe;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 1400px; width: 100%; }
        h1 { text-align: center; font-size: 2.8rem; color: #ff8906; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #a7a9be; margin-bottom: 35px; font-size: 1.2rem; }
        .subtitle span { background: #232946; padding: 4px 14px; border-radius: 30px; color: #ff8906; font-weight: 600; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }
        .card {
            background: #232946;
            padding: 22px 16px;
            border-radius: 18px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid #2d3a5e;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #ff8906;
            box-shadow: 0 10px 30px rgba(255,137,6,0.15);
        }
        .card a {
            color: #fffffe;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            display: block;
        }
        .card a:hover { color: #ff8906; }
        .card small { display: block; color: #b8c1ec; font-size: 0.7rem; margin-top: 10px; opacity: 0.7; }
        .badge {
            display: inline-block;
            background: #ff8906;
            color: #0f0e17;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 8px;
        }
        .counter {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #6c7086;
        }
        .counter span { color: #ff8906; font-weight: 700; }
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 داشبورد یکپارچه</h1>
    <p class="subtitle">همه پروژه‌های قابل نمایش در یک نگاه — <span>پروژه‌های فعال</span></p>
    <div class="grid" id="projectGrid"></div>
    <div class="counter">تعداد پروژه‌ها: <span id="projectCount">0</span></div>
</div>
<script>
    // لیست پروژه‌ها (به‌صورت مستقیم در HTML درج شده)
    const projects = ["3d-conversion-app", "3d-simple-app", "ProbabilityMach", "admin", "bale_3d_bot_backup", "integrated_system_clean", "integrated_system_final", "natiq-mosatalah-web", "nlp_project_optimized", "public.bak", "public", "static.bak", "static", "tetra-business", "tetra-final-system", "tetra-olympic-system", "tetra-pro", "tetra-ultimate-vercel", "tetrasaas-backup-20251221-111421", "tetrasaas-dashboard", "tetrashop-3d-base", "tetrashop-chess-production", "tetrashop-commercial-platform", "tetrashop-complete-dashboard", "tetrashop-complete-platform", "tetrashop-dashboard", "tetrashop-final-dashboard", "tetrashop-final-fixed", "tetrashop-final-intelligent-dashboard", "tetrashop-final-optimized", "tetrashop-final-perfect", "tetrashop-final-sample", "tetrashop-final-simple", "tetrashop-fixed-platform", "tetrashop-fixed", "tetrashop-github-backup-last", "tetrashop-github", "tetrashop-master-dashboard", "tetrashop-operational-dashboard", "tetrashop-pages", "tetrashop-pro-platform", "tetrashop-projects-backup-20251223_205824", "tetrashop-real-codes", "tetrashop-real-dashboard", "tetrashop-real-platform", "tetrashop-resurrected-20251216_225312", "tetrashop-resurrected-immediate-1765910024", "tetrashop-simple-dashboard", "tetrashop100-complete"];

    const grid = document.getElementById('projectGrid');
    const countSpan = document.getElementById('projectCount');

    if (!projects || projects.length === 0 || projects[0] === "هیچ پروژه‌ای یافت نشد") {
        grid.innerHTML = '<p style="color:#a7a9be;text-align:center;padding:40px;">😕 هیچ پروژه‌ای با فایل index.html یافت نشد</p>';
        countSpan.textContent = '۰';
    } else {
        projects.forEach(project => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <a href="/${project}/index.html">${project}</a>
                <small>${project}</small>
                <span class="badge">✅ قابل نمایش</span>
            `;
            grid.appendChild(card);
        });
        countSpan.textContent = projects.length;
    }
</script>
</body>
</html>
