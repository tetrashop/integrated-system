<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمونه رستاخیز Tetrashop</title>
    <style>
        body { font-family: Tahoma; margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; max-width: 600px; }
        h1 { color: #333; margin-bottom: 20px; }
        .badge { background: #ff4757; color: white; padding: 10px 20px; border-radius: 50px; display: inline-block; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 رستاخیز Tetrashop</h1>
        <div class="badge">ایده‌ها زنده می‌شوند!</div>
        <p>این یک پروژه نمونه است که نشان می‌دهد سیستم رستاخیز Tetrashop فعال است.</p>
        <p><strong>پیام:</strong> هیچ ایده‌ای نباید بمیرد!</p>
    </div>
</body>
</html>
