
<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrashop - رستاخیز فوری</title>
    <style>
        body { font-family: Tahoma; margin: 0; padding: 0; background: #f5f5f5; }
        .header { background: linear-gradient(90deg, #1a237e, #311b92); color: white; padding: 40px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .project { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .project:hover { transform: translateY(-5px); }
        .stats { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 رستاخیز فوری Tetrashop</h1>
        <p>ایده‌های بازیابی شده: <span id="project-count">...</span></p>
    </div>

</body>
</html>
